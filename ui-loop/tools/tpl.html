<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEV Navigator · all screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VOICE: a product team's wall of screens, calm and exact
   IDEA: the pin board where every printed phone screen hangs, strings between them
   PICTURE: the board itself, real screenshots at 390 px, wires for every tap
   COLOUR and TYPE: the app's own white and signal blue #2564df, grey wires, Inter
   LAYOUT: thin header, the board fills the rest; tap a screen to see it full length */
:root{color-scheme:light dark;--bg:light-dark(#f3f6fb,#0f141c);--board:light-dark(#e9eef6,#151c27);--ink:light-dark(#10213a,#e8eef8);--muted:light-dark(#5a6d86,#9aabc2);--card:light-dark(#fff,#1c2532);--line:light-dark(#d4dcea,#2a3546);--blue:#2564df;--wire:light-dark(#9fb0c8,#55657d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(2vw,14px);border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-size:20px;line-height:1.1;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:26px;height:0;border-top:2.5px solid var(--blue);vertical-align:middle;margin-right:6px}
.legend i.a{border-color:var(--wire)}.legend i.q{border-top:2px dotted var(--blue)}
.zoom{display:flex;gap:6px}
.zoom button{min-width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;padding:0 12px}
.zoom button:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#wrap{flex:1;overflow:auto;background:var(--board);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;touch-action:pan-x pan-y}
#sizer{position:relative}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.lane{position:absolute;top:24px;font-weight:700;font-size:22px;color:var(--ink)}
.lane small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.lanebg{position:absolute;top:10px;border-radius:26px;background:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.03));border:1px solid var(--line)}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.w{fill:none;stroke-width:2.5;opacity:.75;transition:opacity .2s,stroke-width .2s}
.w.m{stroke:var(--blue)}.w.a{stroke:var(--wire)}.w.q{stroke:var(--blue);stroke-dasharray:2 5;stroke-width:2}
.wl{font:600 13px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-width:5px;stroke-linejoin:round;transition:opacity .2s}
.dim .w,.dim .wl{opacity:.08}.dim .w.on{opacity:1;stroke-width:4}.dim .wl.on{opacity:1}
.card{position:absolute;width:200px;border:0;padding:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.card b{display:block;font-size:14px;line-height:1.25;height:36px;overflow:hidden}
.card img{display:block;width:200px;height:433px;object-fit:cover;object-position:top;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(16,33,58,.12),0 8px 22px rgba(16,33,58,.12);transition:transform .2s,box-shadow .2s}
.card:hover img,.card.sel img{transform:translateY(-3px);box-shadow:0 0 0 3px var(--blue),0 12px 26px rgba(37,100,223,.25)}
.card small{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.3}
#lb{position:fixed;inset:0;background:rgba(9,16,28,.72);display:none;align-items:stretch;justify-content:center;z-index:9;padding:16px}
#lb.open{display:flex}
#lb .panel{background:var(--card);border-radius:22px;width:min(460px,100%);display:flex;flex-direction:column;overflow:hidden}
#lb .top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#lb .top b{flex:1;font-size:15px}
#lb .top button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
#lb .scroll{overflow:auto;flex:1}
#lb img{width:100%;display:block}
#lb .links{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.legend{margin-left:0}h1{font-size:18px}}
</style>
</head>
<body>
<header>
  <div><h1>BEV Navigator · every screen</h1><div class="sub">Start → Questions → Summary → five topics · tap a screen to see it full length · screenshots from V8.3</div></div>
  <div class="legend"><span><i></i>main way</span><span><i class="a"></i>other way</span><span><i class="q"></i>next question</span><span>Back arrow: always the page before</span></div>
  <div class="zoom"><button id="zo" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="zi" aria-label="Zoom in">+</button></div>
</header>
<div id="wrap"><div id="sizer"><div id="board"></div></div></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Screen"><div class="panel"><div class="top"><button id="pv" aria-label="Previous screen">‹</button><b id="lbt"></b><button id="nx" aria-label="Next screen">›</button><button id="cl" aria-label="Close">×</button></div><div class="scroll"><img id="lbi" alt=""></div><div class="links" id="lbl"></div></div></div>
<script>
{
const D=/*DATA*/;
const W=200,IH=433,CH=36+IH+40;
const board=document.getElementById('board'),wrap=document.getElementById('wrap'),sizer=document.getElementById('sizer');
const ids=Object.keys(D.nodes);
let maxX=0,maxY=0;ids.forEach(i=>{const n=D.nodes[i];maxX=Math.max(maxX,n.x+W);maxY=Math.max(maxY,n.y+CH)});
const BW=maxX+60,BH=maxY+60;board.style.width=BW+'px';board.style.height=BH+'px';
let html=D.lanes.map(([x,c,t])=>{const [a,b]=t.split(' · ');return `<div class="lanebg" style="left:${x-18}px;width:${c*230+6}px;height:${BH-20}px"></div><div class="lane" style="left:${x}px">${a}${b?`<small>${b}</small>`:''}</div>`}).join('');
html+=ids.map(i=>{const n=D.nodes[i];return `<button class="card" id="c-${i}" data-id="${i}" style="left:${n.x}px;top:${n.y}px"><b>${n.label}</b><img loading="lazy" src="img/${i}.t.jpg" alt="${n.label}"><small>${n.note||'&nbsp;'}</small></button>`}).join('');
board.innerHTML=html;
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','wires');svg.setAttribute('width',BW);svg.setAttribute('height',BH);
svg.innerHTML='<defs>'+['m','a','q'].map(k=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${k==='a'?'var(--wire)':'var(--blue)'}"/></marker>`).join('')+'</defs>';
const box=i=>{const n=D.nodes[i];return {l:n.x,r:n.x+W,t:n.y+36,b:n.y+36+IH,cx:n.x+W/2,cy:n.y+36+IH/2}};
let paths='',labels='';
D.edges.forEach(([f,t,lab,k],ix)=>{
  const A=box(f),B=box(t);let p,lx,ly;
  if(B.l>=A.r-10){const y1=A.t+120+((ix*37)%180),y2=B.t+120+((ix*53)%180),c=Math.max(60,(B.l-A.r)/2);p=`M${A.r} ${y1} C${A.r+c} ${y1},${B.l-c} ${y2},${B.l-4} ${y2}`;lx=(A.r+B.l)/2;ly=(y1+y2)/2-6}
  else if(B.r<=A.l+10){const y1=A.t+260+((ix*29)%120),y2=B.t+260+((ix*41)%120),c=Math.max(60,(A.l-B.r)/2);p=`M${A.l} ${y1} C${A.l-c} ${y1},${B.r+c} ${y2},${B.r+4} ${y2}`;lx=(A.l+B.r)/2;ly=(y1+y2)/2-6}
  else if(B.t>A.b){p=`M${A.cx} ${A.b+38} C${A.cx} ${A.b+80},${B.cx} ${B.t-90},${B.cx} ${B.t-40}`;lx=(A.cx+B.cx)/2+8;ly=(A.b+B.t)/2}
  else{p=`M${A.cx+40} ${A.t-36} C${A.cx+40} ${A.t-90},${B.cx+40} ${B.b+90},${B.cx+40} ${B.b+44}`;lx=(A.cx+B.cx)/2+48;ly=(A.t+B.b)/2}
  paths+=`<path class="w ${k}" data-f="${f}" data-t="${t}" d="${p}" marker-end="url(#ar-${k})"/>`;
  if(lab)labels+=`<text class="wl" data-f="${f}" data-t="${t}" x="${lx}" y="${ly}" text-anchor="middle">${lab}</text>`;
});
svg.insertAdjacentHTML('beforeend',paths+labels);board.prepend(svg);
let z=1;const setZ=v=>{z=Math.max(.15,Math.min(1.4,v));board.style.transform=`scale(${z})`;sizer.style.width=BW*z+'px';sizer.style.height=BH*z+'px'};
const fit=()=>setZ(Math.min(wrap.clientWidth/BW,1));
fit();addEventListener('resize',()=>{});
document.getElementById('zi').onclick=()=>setZ(z*1.25);document.getElementById('zo').onclick=()=>setZ(z/1.25);document.getElementById('fit').onclick=fit;
wrap.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZ(z*(e.deltaY<0?1.1:.9))},{passive:false});
const hi=i=>{svg.classList.toggle('dim',!!i);svg.querySelectorAll('.w,.wl').forEach(p=>p.classList.toggle('on',!!i&&(p.dataset.f===i||p.dataset.t===i)));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.id===i))};
board.addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(c)hi(c.dataset.id)});
board.addEventListener('mouseleave',()=>{if(!lb.classList.contains('open'))hi(null)});
const lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbt=document.getElementById('lbt'),lbl=document.getElementById('lbl');let cur=0;
const show=k=>{cur=(k+ids.length)%ids.length;const i=ids[cur],n=D.nodes[i];lbi.src=`img/${i}.f.jpg`;lbi.alt=n.label;lbt.textContent=n.label;
  const out=D.edges.filter(e=>e[0]===i).map(e=>`→ ${D.nodes[e[1]].label}${e[2]?' ('+e[2]+')':''}`),inn=D.edges.filter(e=>e[1]===i).map(e=>`← ${D.nodes[e[0]].label}`);
  lbl.textContent=[...inn,...out].join('  ·  ')||'No wires';lb.querySelector('.scroll').scrollTop=0;hi(i)};
board.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;lb.classList.add('open');show(ids.indexOf(c.dataset.id));document.getElementById('cl').focus()});
document.getElementById('cl').onclick=()=>{lb.classList.remove('open');hi(null)};
document.getElementById('pv').onclick=()=>show(cur-1);document.getElementById('nx').onclick=()=>show(cur+1);
lb.addEventListener('click',e=>{if(e.target===lb){lb.classList.remove('open');hi(null)}});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape'){lb.classList.remove('open');hi(null)}if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
}
</script>
</body>
</html>
